server {
    listen       80;
    listen  [::]:80;

    root   /usr/share/nginx/html;

    # Vite emits content-hashed files directly in /assets/ (e.g. /assets/index-BvK3xQ2w.js),
    # so they can be cached forever. A new build always references new file names.
    # The regex is quoted because nginx otherwise reads the braces in {8} as a block.
    location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else (index.html and friends) must be revalidated on every request, otherwise
    # browsers and any CDN in front of us keep serving the old app shell after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
