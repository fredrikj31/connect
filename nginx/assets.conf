server {
    listen       80;
    listen  [::]:80;

    # User uploads written by the backend (UPLOADS_FILE_PATH), e.g. /profiles/<userId>
    root   /usr/share/nginx/data;

    location / {
        # Profile pictures are overwritten in place under the same name, so they must be revalidated.
        add_header Cache-Control "no-cache";
    }
}
