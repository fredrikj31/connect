name: connect

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----- DEVELOPMENT -----
  dev-database:
    container_name: connect-database
    image: postgres:18-alpine
    restart: always
    profiles:
      - dev
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: connect
    ports:
      - 5432:5432
    volumes:
      # Database files are stored on the local file system (gitignored)
      - ./.docker/database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d connect"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  dev-assets:
    container_name: connect-assets
    image: nginx:1.31.6-alpine
    restart: always
    profiles:
      - dev
    ports:
      - ${ASSETS_PORT:-8000}:80
    volumes:
      # Populated by the backend (profile pictures) running locally with UPLOADS_FILE_PATH=../.docker/assets
      - ./.docker/assets:/usr/share/nginx/data:ro
      - ./nginx/assets.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *default-logging

  # ----- PRODUCTION -----
  database:
    container_name: connect-database
    image: postgres:18-alpine
    restart: always
    profiles:
      - prod
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: connect
    ports:
      - ${DATABASE_PORT:-5000}:5432
    networks:
      - connect-network
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d connect"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  migrate:
    container_name: connect-migrate
    image: ghcr.io/fredrikj31/connect-migrate:latest
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    profiles:
      - prod
    environment:
      DATABASE_HOST: connect-database
      DATABASE_PORT: 5432
      DATABASE_NAME: connect
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - connect-network
    logging: *default-logging

  assets:
    container_name: connect-assets
    image: nginx:1.31.6-alpine
    restart: always
    profiles:
      - prod
    networks:
      - cloudflared
    ports:
      - ${ASSETS_PORT:-5003}:80
    volumes:
      - assets-data:/usr/share/nginx/data:ro
      - ./nginx/assets.conf:/etc/nginx/conf.d/default.conf:ro
    logging: *default-logging

  backend:
    container_name: connect-backend
    image: ghcr.io/fredrikj31/connect-backend:latest
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always
    profiles:
      - prod
    environment:
      AUTH_BASE_URL: ${AUTH_BASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_HOST: connect-database
      DATABASE_PORT: 5432
      DATABASE_NAME: connect
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      WEBSITE_BASE_URL: ${WEBSITE_BASE_URL}
      UPLOADS_FILE_PATH: /files # The assets volume mount point; profile pictures land in /files/profiles
    networks:
      - connect-network
      - cloudflared
    volumes:
      - assets-data:/files
    ports:
      - ${BACKEND_PORT:-5001}:3000
    logging: *default-logging

  frontend:
    container_name: connect-frontend
    image: ghcr.io/fredrikj31/connect-frontend:latest
    restart: always
    profiles:
      - prod
    environment:
      MY_APP_API_BASE_URL: ${MY_APP_API_BASE_URL}
      MY_APP_ASSETS_BASE_URL: ${MY_APP_ASSETS_BASE_URL}
    networks:
      - cloudflared
    ports:
      - ${FRONTEND_PORT:-5002}:80
    logging: *default-logging

networks:
  connect-network:
    driver: bridge
  cloudflared:
    external: true

volumes:
  database-data:
    name: connect-database-data
    driver: local
  assets-data:
    name: connect-assets-data
    driver: local
